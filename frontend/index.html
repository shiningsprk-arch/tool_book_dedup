<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查重合并</title>
  <link rel="stylesheet" href="lib/theme.css?v=0.1.7">
  <link rel="stylesheet" href="lib/book_dedup.css?v=0.1.7">
</head>
<body>
  <noscript>本工具需要 JavaScript。</noscript>

  <main class="bd-wrap" id="app">
    <section class="bd-card">
      <h2 class="bd-card-title" data-i18n="scope.title">查重范围</h2>
      <p class="bd-hint" id="scope-hint" data-i18n="scope.loading">正在读取书库信息…</p>
      <div class="bd-row">
        <label class="bd-field">
          <span data-i18n="scope.threshold">相似度阈值</span>
          <input id="threshold" type="number" min="50" max="100" step="1" value="85">
        </label>
        <div class="bd-field bd-field-wide">
          <span data-i18n="scope.note">说明</span>
          <p class="bd-hint" data-i18n="scope.thresholdHint">
            越高越保守（只报几乎一样的），越低越能查出改过书名的重复，但误报也更多。
          </p>
        </div>
      </div>
      <div class="bd-actions">
        <button id="btn-scan" class="bd-btn bd-btn-primary" data-i18n="scope.start">开始查重</button>
        <button id="btn-cancel" class="bd-btn" hidden data-i18n="scope.cancel">取消</button>
      </div>
    </section>

    <section class="bd-card" id="run-card" hidden>
      <div class="bd-run-head">
        <span id="run-label" class="bd-run-label"></span>
        <span id="run-count" class="bd-hint"></span>
      </div>
      <div class="bd-progress"><div class="bd-progress-bar" id="run-bar"></div></div>
      <p class="bd-hint" id="run-detail"></p>
    </section>

    <section class="bd-card" id="summary-card" hidden>
      <h2 class="bd-card-title" data-i18n="summary.title">查重结果</h2>
      <div class="bd-summary" id="summary"></div>
      <div class="bd-row bd-filters">
        <label class="bd-field">
          <span data-i18n="filter.confidence">证据强度</span>
          <select id="filter-confidence">
            <option value="" data-i18n="filter.all">全部</option>
            <option value="strong" data-i18n="confidence.strong">确定</option>
            <option value="likely" data-i18n="confidence.likely">很可能</option>
            <option value="weak" data-i18n="confidence.weak">存疑</option>
          </select>
        </label>
        <label class="bd-field">
          <span data-i18n="filter.keyword">关键字</span>
          <input id="filter-keyword" type="search" data-i18n-attr="placeholder:filter.keywordPlaceholder">
        </label>
      </div>
      <p class="bd-hint" id="list-meta"></p>
      <div id="groups" class="bd-groups"></div>
      <div class="bd-pager" id="pager" hidden>
        <button id="btn-prev" class="bd-btn" data-i18n="pager.prev">上一页</button>
        <span id="pager-label" class="bd-hint"></span>
        <button id="btn-next" class="bd-btn" data-i18n="pager.next">下一页</button>
      </div>
      <p class="bd-empty" id="empty-state" hidden></p>
    </section>

    <section class="bd-card" id="handled-card" hidden>
      <h2 class="bd-card-title" data-i18n="handled.title">本次已处理</h2>
      <ul class="bd-handled" id="handled-list"></ul>
    </section>

    <section class="bd-card" id="ignored-card" hidden>
      <h2 class="bd-card-title">
        <span data-i18n="ignore.title">已忽略（不是重复）</span>
        <span class="bd-hint" id="ignored-count"></span>
      </h2>
      <p class="bd-hint" data-i18n="ignore.hint">
        这些配对以后查重不再报出来。撤销之后重新查重它们会再出现。
      </p>
      <ul class="bd-handled" id="ignored-list"></ul>
      <div class="bd-actions">
        <button id="btn-unignore-all" class="bd-btn" data-i18n="ignore.undoAll">全部撤销</button>
      </div>
    </section>

    <p class="bd-hint bd-credit" data-i18n="app.footer">
      查重判定为 clean-room 实现，设计思路参考 BookOrbit（AGPL-3.0）。
    </p>
  </main>

  <!--
    对照台与合并预览**都没有独立节点**：它们渲染在被点那一行之内（`.bd-drawer`），
    由 app.js 的 drawerHtml()/planHtml() 生成。原先这里有一对居中浮层
    （#bench-overlay / #plan-overlay），真机反馈"报告总是在最中间显示、盖住列表"，
    因此整套浮层连同 .bd-overlay 样式一并删掉。
  -->

  <div class="bd-toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/toolbox-bridge.js"></script>
  <script src="app.js?v=0.1.7"></script>
</body>
</html>
